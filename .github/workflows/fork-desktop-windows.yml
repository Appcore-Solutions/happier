name: Fork Windows desktop installer

# Fork-only: builds an unsigned Windows installer of this fork's desktop app, pointed at the relay
# address given when the workflow is started. It installs side by side with an official Happier
# app ("Happier (Appcore)", its own identifier) and has update checks switched off, so it never
# replaces itself with an official release that lacks this fork's changes.

on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Your relay's public HTTPS address, for example https://happier.example.com"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Appcore-Solutions/happier'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check relay address
        shell: bash
        env:
          RELAY_URL: ${{ inputs.relay_url }}
        run: |
          set -euo pipefail
          case "$RELAY_URL" in
            https://*) ;;
            *) echo "relay_url must be an https:// address the desktop app can reach" >&2; exit 1 ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Enable Corepack (Yarn)
        uses: ./.github/actions/enable-corepack-yarn

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          # Same focused scope as the official desktop build: UI plus shared packages only.
          HAPPIER_INSTALL_SCOPE: "ui,protocol,agents,cli-common,release-runtime,transfers,connection-supervisor,audio-stream-native,sherpa-native"
          npm_config_registry: https://registry.npmjs.org
        uses: ./.github/actions/install-yarn-dependencies
        with:
          args: --frozen-lockfile --ignore-engines

      - name: Build internal packages
        run: yarn -s build:packages

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        env:
          RUSTUP_MAX_RETRIES: "10"
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build installer
        working-directory: apps/ui
        shell: bash
        env:
          APP_ENV: production
          EXPO_PUBLIC_HAPPIER_SERVER_URL: ${{ inputs.relay_url }}
          EXPO_PUBLIC_HAPPY_SERVER_URL: ${{ inputs.relay_url }}
          EXPO_PUBLIC_HAPPIER_DESKTOP_UPDATES_ENABLED: "false"
        run: |
          set -euo pipefail
          node ./scripts/runTauriCli.mjs build --config src-tauri/tauri.appcore.conf.json --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: happier-appcore-windows-installer
          path: apps/ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
